name: Verify photo album
on:
    pull_request:
    push:
        branches: [main]
permissions:
    contents: read
jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      services/photo-gallery/package-lock.json
            - run: npm ci
            - run: npm ci --prefix services/photo-gallery
            - run: npx playwright install --with-deps chromium firefox
            - run: npm run verify
            - run: npm audit --audit-level=high
            - run: npm audit --prefix services/photo-gallery --audit-level=high
            - run: npm run deploy:dry-run
